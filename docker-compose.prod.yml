# For installing a published release - no source checkout needed, just this
# file plus a .env (see .env.example in the repo, or ask for a copy). The
# image is public (no docker login needed) even though the source repo
# itself stays private.
#
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Update to a new release the same way: pull again, then up -d again -
# migrations apply automatically on start, existing data is preserved.
services:
  app:
    image: ghcr.io/corderolb/news-publisher:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/app/data/production.db"
    volumes:
      - news-publisher-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default

volumes:
  news-publisher-data:

# Docker's default bridge MTU (1500) is larger than Tailscale's WireGuard
# tunnel (1280) - if the LLM provider (or anything else) is only reachable
# via a Tailscale IP (100.x.x.x), larger packets need PMTU-discovery-based
# fragmentation to get from the container, through the bridge, out the
# host's tailscale0 interface. That discovery commonly blackholes (ICMP
# "fragmentation needed" gets dropped somewhere in the path), which
# manifests as a connection that opens fine but times out reading the
# response - e.g. "AI_APICallError: Cannot connect to API: read ETIMEDOUT"
# on longer LLM completions specifically, while short requests work.
# Capping the bridge MTU at 1280 avoids the fragmentation path entirely.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1280
