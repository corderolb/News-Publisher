# For building and running from this source checkout (development, or
# building a release yourself). To install a published release without the
# source, use docker-compose.prod.yml instead.
services:
  app:
    build: .
    image: news-publisher:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Points the app at the SQLite file inside the mounted volume below,
      # not the path in .env.example (which is for local `npm run dev`).
      DATABASE_URL: "file:/app/data/production.db"
    volumes:
      - news-publisher-data:/app/data
    # Lets the container reach an LM Studio instance running on the HOST
    # machine via http://host.docker.internal:1234/v1 (set LMSTUDIO_BASE_URL
    # to that in .env). Docker Desktop (Windows/Mac) provides this
    # automatically; on Linux hosts this extra_hosts entry is what makes it
    # resolve. If LM Studio isn't on the host, this line is harmless.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default

volumes:
  news-publisher-data:

# See docker-compose.prod.yml for why this is here: Tailscale's WireGuard
# tunnel uses MTU 1280, below Docker's default bridge MTU (1500) - if any
# provider is only reachable via a Tailscale IP, this avoids a PMTUD
# blackhole that otherwise shows up as a connection that opens fine but
# times out reading a longer response.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1280
